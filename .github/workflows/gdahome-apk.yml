name: GDAHome OS

on:
  push:
    paths:
      - "gdahome-nspanel/**"
      - ".github/workflows/gdahome-apk.yml"
      - "!gdahome-nspanel/docs/renders/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GDAHome OS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gdahome-nspanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ponte Zigbee nativo (gdaserial) per ARM
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p app/src/main/assets
          "$TC/armv7a-linux-androideabi26-clang" -O2 -Wall -fPIE -pie -o app/src/main/assets/gdaserial-armeabi-v7a native/gdaserial.c
          "$TC/aarch64-linux-android26-clang"   -O2 -Wall -fPIE -pie -o app/src/main/assets/gdaserial-arm64-v8a  native/gdaserial.c
          "$TC/llvm-strip" app/src/main/assets/gdaserial-*
          file app/src/main/assets/gdaserial-*
      - name: App GDAHome
        run: |
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          ./gradlew --no-daemon assembleRelease
      - name: Pacchetto GDAHome OS
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GDAHome.apk
          cp app/src/main/assets/gdaserial-* dist/
          cp os/gdahome-os.sh os/bootanimation.zip dist/
          cp tools/* dist/
          cp README.md dist/LEGGIMI.md
          chmod +x dist/*.sh dist/gdaserial-*
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: GDAHome-OS
          path: gdahome-nspanel/dist/
      - name: Render reali dell'interfaccia (480x480 e 750x1334)
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'it.gdahome.panel.RenderTest'
      - name: Mockup dei pannelli
        run: |
          pip install --quiet pillow
          python3 docs/make_mockups.py
      - uses: actions/upload-artifact@v4
        with:
          name: GDAHome-render
          path: gdahome-nspanel/docs/renders/
      - name: Salva i render nel repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/renders
          if ! git diff --cached --quiet; then
            git commit -m "GDAHome: aggiorna i render dell'interfaccia"
            git push origin HEAD:${{ github.ref_name }}
          fi
