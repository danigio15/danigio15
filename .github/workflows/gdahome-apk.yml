name: GDAHome APK

on:
  push:
    paths:
      - "gdahome-nspanel/**"
      - ".github/workflows/gdahome-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gdahome-nspanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: |
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GDAHome.apk
          cp tools/* dist/
      - uses: actions/upload-artifact@v4
        with:
          name: GDAHome
          path: gdahome-nspanel/dist/
